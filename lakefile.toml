name = "DefintionInProgram"
version = "0.1.0"
defaultTargets = ["DefintionInProgram"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = true
# relaxedAutoImplicit = false

[[require]]
name = "mathlib"
path = ".lake/packages/mathlib"

[[require]]
name = "batteries"
path = ".lake/packages/batteries"

[[require]]
name = "Qq"
path = ".lake/packages/Qq"

[[require]]
name = "aesop"
path = ".lake/packages/aesop"

[[require]]
name = "importGraph"
path = ".lake/packages/importGraph"

[[require]]
name = "LeanSearchClient"
path = ".lake/packages/LeanSearchClient"

[[require]]
name = "proofwidgets"
path = ".lake/packages/proofwidgets"

[[require]]
name = "plausible"
path = ".lake/packages/plausible"

[[require]]
name = "Cli"
path = ".lake/packages/Cli"

[[require]]
name = "iris-lean"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"

[[require]]
name = "wander"
git.url = "https://github.com/ayhon/wander.git"
rev = "main"

[[lean_lib]]
name = "ITree"
globs = ["ITree", "ITree.+"]

[[lean_lib]]
name = "Paco"
globs = ["Paco", "Paco.+"]

[[lean_lib]]
name = "ProgramLogicCarte"
globs = ["ProgramLogicCarte", "ProgramLogicCarte.+"]

[[lean_lib]]
name = "DefinitionInProgramLib"
globs = ["DefintionInProgram.+"]

[[lean_lib]]
name = "IrisTutorial"
globs = ["IrisTutorial", "IrisTutorial.+"]

[[lean_lib]]
name = "IrisUtil"
globs = ["IrisUtil.+"]

[[lean_exe]]
name = "DefintionInProgram"
root = "Main"
